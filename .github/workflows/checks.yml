name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s sglang/tests -v
      - run: python sglang/experiments/sg18-prefill-tp-split/verify-source.py
      - run: python sglang/experiments/sg18-prefill-tp-split/verify-results.py
      - run: python sglang/experiments/sg18-prefill-tp-split/verify-promotion.py
      - run: python -m compileall -q scripts runtime bench
      - run: python -m compileall -q sglang/scripts sglang/runtime sglang/validation
      - run: bash -n scripts/build.sh runtime/run-node.sh bench/run-community.sh
      - run: bash -n sglang/scripts/build.sh sglang/bench/run-community.sh
